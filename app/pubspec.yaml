name: royale_connect
description: Royale Connect — the Royale Concorde International School app for parents, students and staff.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.15.1
  firebase_messaging: ^16.7.1
  firebase_crashlytics: ^5.4.1
  pdf: ^3.13.1
  printing: ^5.15.1
  cached_network_image: ^3.4.1
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.3.1
  http: ^1.2.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
