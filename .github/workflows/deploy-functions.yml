# Deploys the server functions to the school's Supabase project — from GitHub, no laptop software.
# Runs whenever anything under supabase/functions changes, or when started by hand (Actions → Deploy functions → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – from https://supabase.com/dashboard/account/tokens
#   SUPABASE_JWT_SECRET    – Supabase → Project Settings → API → JWT Settings → (legacy) JWT secret
# Optional secrets, added later when those accounts exist: MSG91_AUTHKEY, MSG91_TEMPLATE_ID, FCM_SERVICE_ACCOUNT_JSON,
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
name: Deploy functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

env:
  PROJECT_REF: upgvxhsxmdihmfmzknlq
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set function secrets
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          add() { if [ -n "$2" ]; then echo "$1=$2" >> .env.deploy; fi; }
          : > .env.deploy
          add APP_JWT_SECRET           "${{ secrets.SUPABASE_JWT_SECRET }}"
          add APP_WEB_URL              "${{ secrets.APP_WEB_URL || 'https://royaleconnect.github.io/royaleconnect' }}"
          add MSG91_AUTHKEY            "${{ secrets.MSG91_AUTHKEY }}"
          add MSG91_TEMPLATE_ID        "${{ secrets.MSG91_TEMPLATE_ID }}"
          add RAZORPAY_KEY_ID          "${{ secrets.RAZORPAY_KEY_ID }}"
          add RAZORPAY_KEY_SECRET      "${{ secrets.RAZORPAY_KEY_SECRET }}"
          add RAZORPAY_WEBHOOK_SECRET  "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}"
          supabase secrets set --env-file .env.deploy --project-ref "$PROJECT_REF"
          rm .env.deploy
          # the Firebase key file is several lines long: squeeze it to one line and set it on its own
          if [ -n "$FCM_JSON" ]; then
            ONE_LINE="$(printf '%s' "$FCM_JSON" | jq -c .)" || { echo "FCM_SERVICE_ACCOUNT_JSON is not valid JSON - paste the whole file again"; exit 1; }
            supabase secrets set "FCM_SERVICE_ACCOUNT_JSON=$ONE_LINE" --project-ref "$PROJECT_REF" >/dev/null
            echo "Firebase key set for project $(printf '%s' "$FCM_JSON" | jq -r .project_id)"
          fi

      - name: Deploy
        run: |
          for f in login-student login-staff login-otp password nightly-fees send-notifications razorpay-order razorpay-webhook; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - name: Smoke test (sample student)
        run: |
          curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/login-student" \
            -H "apikey: sb_publishable_8mtHFfZ9Fk3p1YdG6gwydw_IXlULRxR" -H "content-type: application/json" \
            -d '{"admission_no":"LK/10/2014","password":"Welcome1"}' | head -c 300; echo
