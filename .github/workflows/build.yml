# Builds Royale Connect automatically on every push to main:
#   • web  → published to GitHub Pages  (https://royaleconnect.github.io/royaleconnect/)
#   • Android APK → attached to a "latest" release on the repo's Releases page (install on any Android phone)
# Nothing to install on anyone's computer. First run takes ~10 minutes; later runs ~5.
name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create platform folders (android/ ios/ web/) if missing
        working-directory: app
        run: |
          if [ ! -d android ]; then flutter create . --org in.rcis --project-name royale_connect --platforms android,web; fi
          rm -rf test            # sample test generated by flutter create refers to a class we don't have
          # stray copies made by Windows when a file is downloaded twice ("name-1.dart", "name (1).dart") are never part of the app
          find lib -type f \( -name '*-[0-9].dart' -o -name '* ([0-9]).dart' \) -print -delete
          # Some add-ons (e.g. file_picker) pin an old Android SDK; build every add-on against SDK 36,
          # which the newer Android libraries require. Added at the top so it runs before anything is evaluated.
          if [ -f android/build.gradle.kts ] && ! grep -q "forceSdk" android/build.gradle.kts; then
            printf '%s\n' \
              'subprojects {' \
              '    val forceSdk: Project.() -> Unit = { extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) } }' \
              '    if (state.executed) forceSdk(this) else afterEvaluate { forceSdk(this) }' \
              '}' | cat - android/build.gradle.kts > /tmp/bg.kts && mv /tmp/bg.kts android/build.gradle.kts
          elif [ -f android/build.gradle ] && ! grep -q "forceSdk" android/build.gradle; then
            printf '%s\n' \
              'subprojects { p -> def forceSdk = { if (p.hasProperty("android")) p.android.compileSdkVersion 36 }' \
              '  if (p.state.executed) forceSdk() else p.afterEvaluate { forceSdk() } }' | cat - android/build.gradle > /tmp/bg && mv /tmp/bg android/build.gradle
          fi
          head -5 android/build.gradle* || true
          # Xiaomi/Redmi/POCO (MIUI, HyperOS) and some other phones repaint apps in their own "dark mode", turning our
          # ivory screens black. Tell Android the app draws its own colours.
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do
            if [ -f "$f" ] && ! grep -q forceDarkAllowed "$f"; then sed -i 's#</style>#    <item name="android:forceDarkAllowed">false</item>\n    </style>#g' "$f"; fi
          done
          grep -c forceDarkAllowed android/app/src/main/res/values/styles.xml || true
          # app name under the phone icon
          sed -i 's/android:label="[^"]*"/android:label="Royale Connect"/' android/app/src/main/AndroidManifest.xml
          # icons: ivory background, brighter and larger R (tools/make_icon.py), then generate every size
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || sudo apt-get install -y -qq python3-pil
          python3 tools/make_icon.py || echo "icon step skipped - keeping the old icons"
          sed -i 's/adaptive_icon_background: "#FFFFFF"/adaptive_icon_background: "#FFFDF8"/' pubspec.yaml
          flutter pub get
          dart run flutter_launcher_icons || true
          # web branding: our R monogram as the tab icon + app icons, proper title
          cp assets/icons/app_icon.png web/favicon.png
          cp assets/icons/app_icon.png web/icons/Icon-192.png
          cp assets/icons/app_icon.png web/icons/Icon-512.png
          cp assets/icons/app_icon.png web/icons/Icon-maskable-192.png
          cp assets/icons/app_icon.png web/icons/Icon-maskable-512.png
          sed -i 's#<title>royale_connect</title>#<title>Royale Connect</title>#; s#content="royale_connect"#content="Royale Connect"#g; s#content="A new Flutter project."#content="Royale Concorde International School — fees, diary, announcements, messages and bus, in one app."#' web/index.html
          sed -i 's#"name": "royale_connect"#"name": "Royale Connect"#; s#"short_name": "royale_connect"#"short_name": "Royale Connect"#; s#"description": "A new Flutter project."#"description": "Royale Concorde International School app"#; s#"background_color": "\#0175C2"#"background_color": "\#FFFFFF"#; s#"theme_color": "\#0175C2"#"theme_color": "\#B5121A"#' web/manifest.json

      - name: Fonts for the PDF receipts and report cards (Noto Sans / Noto Serif, with the ₹ sign)
        working-directory: app
        run: |
          mkdir -p assets/fonts
          F=/tmp/rcfonts; mkdir -p $F
          ( cd $F && npm init -y >/dev/null && npm i --silent --no-audit --no-fund @expo-google-fonts/noto-sans@0.4.2 @expo-google-fonts/noto-serif@0.4.2 ) || echo "font download failed - PDFs will use a plain font"
          cp $F/node_modules/@expo-google-fonts/noto-sans/400Regular/NotoSans_400Regular.ttf assets/fonts/NotoSans-Regular.ttf || true
          cp $F/node_modules/@expo-google-fonts/noto-sans/700Bold/NotoSans_700Bold.ttf assets/fonts/NotoSans-Bold.ttf || true
          cp $F/node_modules/@expo-google-fonts/noto-serif/700Bold/NotoSerif_700Bold.ttf assets/fonts/NotoSerif-Bold.ttf || true
          ls -la assets/fonts; [ -n "$(ls assets/fonts)" ] || touch assets/fonts/.keep

      - name: Connect Firebase (phone notifications + crash reports)
        working-directory: app
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "GOOGLE_SERVICES_JSON secret not set - Android builds without notifications"; exit 0; fi
          printf '%s' "$GSJ" > android/app/google-services.json
          jq -e . android/app/google-services.json >/dev/null || { echo "GOOGLE_SERVICES_JSON is not valid - paste the whole google-services.json again"; exit 1; }
          echo "Firebase project: $(jq -r .project_info.project_id android/app/google-services.json)"
          jq -e '.client[].client_info.android_client_info.package_name | select(. == "in.rcis.royale_connect")' android/app/google-services.json >/dev/null \
            || { echo "google-services.json is not for in.rcis.royale_connect"; exit 1; }
          if [ -f android/settings.gradle.kts ]; then
            grep -q gms.google-services android/settings.gradle.kts || sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.google.firebase.crashlytics") version "3.0.2" apply false' android/settings.gradle.kts
            grep -q gms.google-services android/app/build.gradle.kts || sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")\n    id("com.google.firebase.crashlytics")' android/app/build.gradle.kts
          else
            grep -q gms.google-services android/settings.gradle || sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false\n    id "com.google.firebase.crashlytics" version "3.0.2" apply false' android/settings.gradle
            grep -q gms.google-services android/app/build.gradle || sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"\n    id "com.google.firebase.crashlytics"' android/app/build.gradle
          fi
          grep -c "google-services\|crashlytics" android/settings.gradle* android/app/build.gradle* || { echo "could not add the Firebase plugins"; exit 1; }
          # notification icon: white R in the status bar, crimson accent
          if [ -d tools/res ]; then
            cp -r tools/res/. android/app/src/main/res/
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><color name="rc_notify">#B5121A</color></resources>' > android/app/src/main/res/values/rc_colors.xml
            grep -q default_notification_icon android/app/src/main/AndroidManifest.xml || sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify"/>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/rc_notify"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          fi
          grep -n "notification" android/app/src/main/AndroidManifest.xml || true

      - name: Check the code (stops here on any real error, so a broken update never reaches parents)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        working-directory: app
        run: |
          flutter build web --release --base-href /royaleconnect/
          cp build/web/index.html build/web/404.html   # deep links (e.g. /pay/done) on GitHub Pages

      - name: Upload web for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

      - name: Build Android APK
        id: apk
        continue-on-error: true          # web still publishes if Android has a hiccup
        working-directory: app
        run: flutter build apk --release

      - name: Publish APK on the "latest" release
        if: steps.apk.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Royale Connect — latest build
          body: "Android: download royale-connect.apk and open it on the phone (allow 'install from this source' once). Web: https://royaleconnect.github.io/royaleconnect/"
          files: app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
