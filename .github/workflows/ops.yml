# Keeps an eye on the live system — runs on GitHub's computers, nothing to install.
#   • every 30 minutes: is the website up, does the database answer?  (a failed run = GitHub emails the account owner)
#   • every night 03:00 IST: full database backup, encrypted with BACKUP_PASSPHRASE, kept 30 days under Actions → Ops → the run → Artifacts
#   • every night too: all uploaded files (photos, report PDFs, documents, chat attachments) in one encrypted file, kept 14 days
# Needs repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_DB_URL     – Supabase → Connect → "Session pooler" connection string, with the database password filled in
#   BACKUP_PASSPHRASE   – any long phrase you choose; needed to open a backup. Keep it written down with the school.
#   SUPABASE_SERVICE_ROLE_KEY – Supabase → Project Settings → API keys → service_role (secret) key; only for the files backup.
#                         Without it the files backup is skipped with a warning (the database backup still runs).
# Restoring a backup: download the .gpg file, then  gpg -d rcis-backup-DATE.sql.gpg | gunzip > backup.sql  and load it with psql (IT guide).
# Restoring files:     gpg -d rcis-files-DATE.tar.gz.gpg | tar xz   → a folder "files/" with the same paths as in the storage bucket.
name: Ops
on:
  schedule:
    - cron: "*/30 * * * *"     # health check
    - cron: "30 21 * * *"      # 21:30 UTC = 03:00 IST backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: github.event.schedule != '30 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 12           # a hung connection must not keep the check running for hours
    steps:
      - name: Website answers
        run: curl -fsS -o /dev/null --max-time 30 --retry 3 --retry-delay 20 https://royaleconnect.github.io/royaleconnect/
      - name: Database answers
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-delay 20 "https://upgvxhsxmdihmfmzknlq.supabase.co/rest/v1/academic_year?select=label&limit=1" \
            -H "apikey: sb_publishable_8mtHFfZ9Fk3p1YdG6gwydw_IXlULRxR" > /dev/null
      - name: Sign-in service answers
        run: |
          code=$(curl -s -o /dev/null --max-time 30 --retry 2 --retry-delay 20 -w "%{http_code}" -X POST "https://upgvxhsxmdihmfmzknlq.supabase.co/functions/v1/login-student" \
            -H "apikey: sb_publishable_8mtHFfZ9Fk3p1YdG6gwydw_IXlULRxR" -H "content-type: application/json" -d '{"admission_no":"","password":""}')
          echo "login-student answered $code"
          [ "$code" -lt 500 ]

  backup:
    if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then echo "::warning::Backup skipped: add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets"; echo "skip=1" >> $GITHUB_ENV; fi
      - name: Dump and encrypt
        if: env.skip != '1'
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          set -o pipefail
          name="rcis-backup-$(date -u +%Y-%m-%d).sql.gpg"
          docker run --rm postgres:17 pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=storage \
            | gzip -9 | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "$name"
          ls -lh "$name"
          [ $(stat -c %s "$name") -gt 2000 ]   # an empty dump means something went wrong
          echo "file=$name" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: env.skip != '1'
        with:
          name: ${{ env.file }}
          path: ${{ env.file }}
          retention-days: 30

  files-backup:
    if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}", KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ] || [ -z "$KEY" ]; then echo "::warning::Files backup skipped: add SUPABASE_DB_URL, BACKUP_PASSPHRASE and SUPABASE_SERVICE_ROLE_KEY secrets"; echo "skip=1" >> $GITHUB_ENV; fi
      - name: Download every file and encrypt
        if: env.skip != '1'
        env: { DB: "${{ secrets.SUPABASE_DB_URL }}", PASS: "${{ secrets.BACKUP_PASSPHRASE }}", KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          set -o pipefail
          base="https://upgvxhsxmdihmfmzknlq.supabase.co/storage/v1/object/authenticated"
          docker run --rm postgres:17 psql "$DB" -At -c "select bucket_id || '/' || name from storage.objects where name is not null order by 1" > list.txt
          echo "$(wc -l < list.txt) files to copy"
          fails=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            enc=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$path")
            mkdir -p "files/$(dirname "$path")"
            curl -fsS --retry 3 -H "authorization: Bearer $KEY" -H "apikey: $KEY" "$base/$enc" -o "files/$path" || { fails=$((fails+1)); echo "::warning::could not copy $path"; }
          done < list.txt
          echo "copy failures: $fails"
          name="rcis-files-$(date -u +%Y-%m-%d).tar.gz.gpg"
          tar czf - files list.txt | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "$name"
          ls -lh "$name"
          echo "file=$name" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        if: env.skip != '1'
        with:
          name: ${{ env.file }}
          path: ${{ env.file }}
          retention-days: 14
